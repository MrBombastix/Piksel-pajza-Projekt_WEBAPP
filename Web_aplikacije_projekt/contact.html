<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <title>PikselŠpajza | Kontakt</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Kontaktirajte PikselŠpajzu – pošaljite upit ili pronađite nas na karti.">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="contact.css">
    <link rel="icon" href="/images/favicon.ico">
</head>
<body>

<header>
    <div class="banner">
        <h1>PikselŠpajza</h1>
        <p>Kontaktirajte nas</p>
    </div>

    <nav>
        <ul>
            <li><a href="index.html">Početna</a></li>
            <li><a href="news/news.html">Novosti</a></li>
            <li><a href="gallery.html">Galerija</a></li>
            <li><a href="tutorial.html">Tutorijal</a></li>
            <li><a href="contact.html">Kontakt</a></li>
            <li><a href="about.html">O nama</a></li>
        </ul>
    </nav>
</header>

<main>

    <!-- Google Mapa -->
    <section class="contact-info">
        <h2>Naša lokacija</h2>
        <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d415.33517577762814!2d16.668915642907333!3d45.54970426837934!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x4766fee66ee316cf%3A0xc79e598eaa578e1e!2sTrg%20svetog%20Antuna%206A%2C%2044317%2C%20Voloder!5e0!3m2!1shr!2shr!4v1767640356260!5m2!1shr!2shr" 
        allowfullscreen="" 
        loading="lazy" 
        referrerpolicy="no-referrer-when-downgrade"></iframe>
    </section>

    <!-- Kontakt Forma -->
    <section class="contact-form">
        <h2>Pošaljite nam poruku</h2>
        <form action="#" method="post">
            <label for="first-name">Ime *</label>
            <input type="text" id="first-name" name="first-name" required>

            <label for="last-name">Prezime *</label>
            <input type="text" id="last-name" name="last-name" required>

            <label for="email">E-mail adresa *</label>
            <input type="email" id="email" name="email" required placeholder="primjer@domena.com">

            <label for="country">Država</label>
            <select id="country" name="country">
                <option value="">Odaberite državu</option>
                <option value="hr">Hrvatska</option>
                <option value="sl">Slovenija</option>
                <option value="bih">Bosna i Hercegovina</option>
                <option value="rs">Srbija</option>
                <option value="other">Ostalo</option>
            </select>

            <label for="message">Opis poruke</label>
            <textarea id="message" name="message" rows="5" placeholder="Ovdje napišite svoju poruku..."></textarea>

            <button type="submit">Pošalji</button>
        </form>
    </section>

</main>
<div class="background-icons">
        <img src="images/cloudy.png" class="bg-icon" alt="Cloudy Icon">
        <img src="images/key.png" class="bg-icon" alt="Key Icon">
        <img src="images/lightning-bolt.png" class="bg-icon" alt="Lightning Bolt Icon">
        <img src="images/love-always-wins.png" class="bg-icon" alt="Love Icon">
        <img src="images/music.png" class="bg-icon" alt="Music Icon">
        <img src="images/smile.png" class="bg-icon" alt="Smile Icon">
    </div>

                <img src="/images/github-mark.svg" alt="GitHub repozitorij PikselŠpajza" width="32">
            </a>
        </div>
    </footer>

</body>
</html>
